[market]
symbols = ["BTC-USDT-SWAP"]
timeframes = ["30m"]
tick_value = 0.01 # Assuming BTC-USDT has 0.01 tick size

[data]
root = "data/okx"

[risk]
starting_equity = 10000.0
risk_per_trade_pct = 0.01

[costs]
commission_rate = 0.0005 # 0.05%
slippage_min = 0.0001 # 0.01%

[hmm]
n_states = 3

[selector]
enter_th = 0.45
exit_th = 0.35
persistence = 2 # For 30m

[strategy_mapping]
trend = ["Trend"]
mr    = []          # ← OFF temporal
high_vol = []

[strategy_params]
Trend_risk_mult = 1.0
MR_risk_mult    = 0.4

