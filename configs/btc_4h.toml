[market]
symbols    = ["BTC-USDT-SWAP"]
timeframes = ["4h"]
tick_value = 1.0

[data]
root = "data/okx"
backfill_months = 12
exchange = "okx"

[risk]
starting_equity      = 10000
risk_per_trade_pct = 0.002
max_daily_loss_pct   = 0.03

[costs]
commission_rate = 0.0005
slippage_min    = 0.5
spread_bias     = 0.0

[hmm]
n_states       = 3
retrain_every  = 1000

[run]
limit_bars = 0
symbols    = ["BTC-USDT-SWAP"]

[strategy_mapping]
trend = ["Trend"]
mr = [] # MR OFF for BTC 4H
high_vol = []

[strategy_params]
Trend_risk_mult = 1.0
MeanRevert_risk_mult = 0.0 # Effectively disable MR
Trend_arm_rbody_th = 0.55
Trend_arm_adx_th = 20.0
Trend_arm_adx_delta_th = 0.5
Trend_arm_timeout = 16
Trend_retest_eps_pct = 0.25
Trend_reconfirm_mult_1 = 0.0003
Trend_reconfirm_mult_2 = 0.0008
Trend_sl_mult_atr = 2.4
Trend_tp_mult_sl = 1.8
Trend_tp_mult_atr = 3.0
Trend_partial_tp_atr_mult = 1.2
Trend_partial_sl_offset_atr_mult = 0.3
Trend_sl_cooldown_duration = 6
Trend_allow_shorts = false

MeanRevert_gate_pmax_th = 0.40
MeanRevert_gate_adx_th = 16.0
MeanRevert_gate_atr_pct_th = 0.85
MeanRevert_dist_sma_mult = 1.1
MeanRevert_signal_z_th = -1.0
